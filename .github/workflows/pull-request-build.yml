name: Pull Request Build Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [seo-validation-nov-2026]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Validate SEO metadata, sitemap and internal links
        run: python scripts/check_seo.py
